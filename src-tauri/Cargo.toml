[package]
name = "azaleaos-full"
version = "0.1.0"
description = "AzaleaOS Full - Desktop Experience Layer for Windows"
authors = ["Azalea"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
log = "0.4"
fern = "0.6"
chrono = "0.4"
env_logger = "0.11"
walkdir = "2"
sysinfo = "0.37"
uuid = { version = "1.8", features = ["v4"] }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Memory"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
